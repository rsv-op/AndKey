name: BuildGenie Offline APK & Model Bundler

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-offline-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Required for Android Gradle 8+ & Apache POI 5.2+)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android SDK (pre-installed on ubuntu-latest)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lh $ANDROID_HOME/platforms 2>&1 | head -n 20
          sdkmanager --version 2>&1 | head -n 5 || echo "sdkmanager not in PATH (using $ANDROID_HOME/cmdline-tools)"

      - name: Fetch Open-Source ONNX/TFLite Models (Bypasses GitHub 100MB File Limit)
        run: |
          mkdir -p app/src/main/assets/models
          echo "Downloading quantized all-MiniLM-L6-v2 ONNX embedding model (~23MB)..."
          curl -L -s "https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main/onnx/model_quantized.onnx" -o app/src/main/assets/models/all-MiniLM-L6-v2-quant.onnx
          curl -L -s "https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main/vocab.txt" -o app/src/main/assets/models/vocab.txt
          echo "Models fetched:"
          ls -lh app/src/main/assets/models/
          test -s app/src/main/assets/models/all-MiniLM-L6-v2-quant.onnx || (echo "ONNX download failed" && exit 1)

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Verify Zero-Internet Permission in Merged Manifest
        run: |
          gradle :app:processDebugMainManifest --stacktrace
          if grep -q "android.permission.INTERNET" app/build/intermediates/merged_manifests/debug/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission detected in merged manifest!"
            grep -n "INTERNET" app/build/intermediates/merged_manifests/debug/AndroidManifest.xml
            exit 1
          else
            echo "VERIFIED: 100% Offline APK (No INTERNET permission present)."
          fi

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Assemble Release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK is Real Compiled Archive (not dummy)
        run: |
          echo "=== APK Validation Gate ==="
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            echo "--- $apk ---"
            unzip -l "$apk" | grep -E "classes.dex|AndroidManifest.xml" || (echo "ERROR: $apk is not a valid compiled APK (missing classes.dex/AndroidManifest.xml)" && exit 1)
            # Also verify via aapt if available
            if command -v aapt2 >/dev/null 2>&1; then
              aapt2 dump badging "$apk" 2>&1 | head -n 20
            elif [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/build-tools/34.0.0/aapt2" ]; then
              $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging "$apk" 2>&1 | head -n 20
            fi
          done
          echo "VERIFIED: APKs are real compiled ZIP/DEX archives"

      - name: Upload Ready-to-Install Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BuildGenie-Offline-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          compression-level: 0

      - name: Upload Merged Manifest for Audit
        uses: actions/upload-artifact@v4
        with:
          name: merged-manifest
          path: app/build/intermediates/merged_manifests/debug/AndroidManifest.xml
