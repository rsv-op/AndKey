name: Build BuildGenie Toolkit APK (guide + tools)

# Packages TERMUX_PYTHON_WINDOWS_GUIDE.md and tools/model_toolkit.py into a
# small, zero-network, dependency-free APK with native Load/Inspect/Generate/
# Replace implementations. Builds in well under a minute because the module has
# no third-party dependencies (framework-only, like the Python tool: stdlib only).

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "guide_toolkit/**"
      - "tools/**"
      - "TERMUX_PYTHON_WINDOWS_GUIDE.md"
      - ".github/workflows/build-guide-toolkit-apk.yml"
  pull_request:
    paths:
      - "guide_toolkit/**"
      - "tools/**"
      - "TERMUX_PYTHON_WINDOWS_GUIDE.md"
      - ".github/workflows/build-guide-toolkit-apk.yml"

permissions:
  contents: write
  actions: read

jobs:
  build-guide-toolkit-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          ls -lh "$ANDROID_HOME/platforms" | head -n 10
          ls -lh "$ANDROID_HOME/build-tools" | head -n 10

      - name: Verify bundled documents exist
        run: |
          test -s TERMUX_PYTHON_WINDOWS_GUIDE.md || (echo "guide missing" && exit 1)
          test -s tools/model_toolkit.py || (echo "toolkit missing" && exit 1)
          echo "guide:  $(wc -c < TERMUX_PYTHON_WINDOWS_GUIDE.md) bytes"
          echo "python: $(wc -c < tools/model_toolkit.py) bytes"

      - name: Assemble Debug + Release APK
        run: |
          set -o pipefail
          chmod +x gradlew
          gradle :guide_toolkit:assembleDebug :guide_toolkit:assembleRelease --stacktrace 2>&1 | tee /tmp/build.log

      - name: Verify APK content (guide + toolkit are really inside)
        run: |
          set -e
          mkdir -p /tmp/apk
          find guide_toolkit/build/outputs -name '*.apk' -exec cp -v {} /tmp/apk/ \;
          ls -lh /tmp/apk
          for apk in /tmp/apk/*.apk; do
            echo "=== $apk ==="
            unzip -l "$apk" | head -n 25
            unzip -l "$apk" | grep -q 'assets/TERMUX_PYTHON_WINDOWS_GUIDE.md' \
              || (echo "ERROR: guide asset missing from $apk" && exit 1)
            unzip -l "$apk" | grep -q 'assets/model_toolkit.py' \
              || (echo "ERROR: python toolkit asset missing from $apk" && exit 1)
            unzip -l "$apk" | grep -q 'classes.dex' \
              || (echo "ERROR: no classes.dex (not a compiled APK)" && exit 1)
            echo "OK: guide + toolkit + dex present"
            if [ -x "$ANDROID_HOME/build-tools/34.0.0/aapt2" ]; then
              "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$apk" | head -n 8
            fi
          done
          # Name the debug APK exactly as the docs expect
          if [ -f /tmp/apk/guide_toolkit-debug.apk ]; then
            cp /tmp/apk/guide_toolkit-debug.apk /tmp/apk/BuildGenie-Toolkit-debug.apk
          fi
          if [ -f /tmp/apk/guide_toolkit-release-unsigned.apk ]; then
            cp /tmp/apk/guide_toolkit-release-unsigned.apk /tmp/apk/BuildGenie-Toolkit-release.apk
          elif [ -f /tmp/apk/guide_toolkit-release.apk ]; then
            cp /tmp/apk/guide_toolkit-release.apk /tmp/apk/BuildGenie-Toolkit-release.apk
          fi

      - name: Zero-network audit (no INTERNET permission)
        run: |
          APK=$(find /tmp/apk -name 'BuildGenie-Toolkit-debug.apk' | head -n 1)
          AAPT2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          if [ -x "$AAPT2" ] && [ -n "$APK" ]; then
            "$AAPT2" dump permissions "$APK" | tee /tmp/perms.txt
            if grep -qi 'android.permission.INTERNET' /tmp/perms.txt; then
              echo "::error::INTERNET permission found — offline guarantee broken"
              exit 1
            fi
            echo "VERIFIED: zero-network APK (no INTERNET permission)"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuildGenie-Toolkit-APK
          path: /tmp/apk/*.apk
          if-no-files-found: error
          retention-days: 90

      # CI artifact downloads are served from a blob host that some networks
      # block. Mirroring the finished APKs into a single, always-overwritten git
      # tag makes the download work anywhere `git` does:
      #   git fetch origin refs/tags/apk-latest:refs/tags/apk-latest
      #   git show apk-latest:ci-artifacts/guide_toolkit-debug.apk > app.apk
      - name: Mirror APKs into the apk-latest tag
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          git config user.name "BuildGenie CI"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p ci-artifacts
          cp /tmp/apk/*.apk ci-artifacts/
          cat > ci-artifacts/README.txt <<'EOF'
          BuildGenie Toolkit APKs, built by .github/workflows/build-guide-toolkit-apk.yml.

          guide_toolkit-debug.apk    debug build (applicationId com.buildgenie.toolkit.debug)
          guide_toolkit-release.apk  release build signed with the debug keystore (sideload-ready)

          This tag is force-updated on every build, so it always holds the newest APKs.
          Install with:  adb install -r guide_toolkit-release.apk
          EOF
          git add -f ci-artifacts
          git commit -q -m "ci: BuildGenie Toolkit APK (run ${GITHUB_RUN_NUMBER})"
          git push -f origin "HEAD:refs/tags/apk-latest"
          echo "Published APKs to tag apk-latest"

      - name: Attach APKs to a release (main/master only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: toolkit-${{ github.run_number }}
          name: BuildGenie Toolkit ${{ github.run_number }}
          body: |
            **BuildGenie Toolkit** — `TERMUX_PYTHON_WINDOWS_GUIDE.md` + `tools/model_toolkit.py`
            compiled into one zero-network APK (API 26+).

            - ① Load · ② Inspect `.gguf`/`.litert`/`.ablitert` · ③ Generate · ④ Replace with `.bak` rollback
            - Guide and Python source bundled verbatim as assets (never drift from the repo)
            - No INTERNET permission, no third-party libraries
          files: /tmp/apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
